# Install as /etc/systemd/system/sensor-v3-client.service.d/pi4gpio.conf.
# Keep the base unit unchanged so the direct backend remains available as a fallback.
[Unit]
Wants=pi4gpio.service
After=pi4gpio.service

[Service]
Environment=RPI_SENSOR_BACKEND=pi4gpio
Environment=PI4GPIO_SOCKET_PATH=/run/pi4gpio/pi4gpio.sock
Environment=PYTHONUNBUFFERED=1

# Permit only the Unix socket and block direct access to physical devices.
PrivateDevices=true
DevicePolicy=closed
NoNewPrivileges=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
