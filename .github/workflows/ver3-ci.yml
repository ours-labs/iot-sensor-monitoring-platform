name: Ver3 CI

on:
  push:
    branches: [main, "publication/**"]
    paths:
      - "ver3/**"
      - "SensorDataApp-v3/**"
      - ".github/workflows/ver3-ci.yml"
      - ".github/VER3_CI.md"
      - "README.md"
      - "DEPENDENCY_LICENSE_AUDIT.md"
      - "LICENSE"
      - "PUBLICATION.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "VER3_BASELINE.md"
  pull_request:
    paths:
      - "ver3/**"
      - "SensorDataApp-v3/**"
      - ".github/workflows/ver3-ci.yml"
      - ".github/VER3_CI.md"
      - "README.md"
      - "DEPENDENCY_LICENSE_AUDIT.md"
      - "LICENSE"
      - "PUBLICATION.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "VER3_BASELINE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-postgres:
    name: Python / PostgreSQL / 85 devices
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ver3_test
          POSTGRES_PASSWORD: ver3_test_password
          POSTGRES_DB: sensor_ver3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ver3_test -d sensor_ver3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ver3_test:ver3_test_password@127.0.0.1:5432/sensor_ver3_test
      # Test-only non-secret value. Never pass a production TOKEN_HASH_KEY to CI.
      TOKEN_HASH_KEY: ci-test-only-not-a-secret-${{ github.run_id }}-padding
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ver3/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ver3/requirements.txt
      - name: Run all Python tests
        working-directory: ver3
        run: python -m unittest discover -s . -p "test_*.py"
      - name: Verify Ver3 boundary
        working-directory: ver3
        run: python tools/verify_ver3_boundary.py
      - name: Compile and check dependencies
        working-directory: ver3
        run: |
          python -m compileall -q .
          python -m pip check
          find . -type f -name '*.sh' -exec bash -n {} +
      - name: Public information scan
        working-directory: ver3
        run: python tools/public_release_scan.py
      - name: Run 85-device CI load
        working-directory: ver3
        run: >-
          python tools/run_concurrency_soak.py
          --devices 85
          --messages-per-device 12
          --writers 85
          --readers 10
          --measured-step-seconds 10
          --result results/ci-85-devices.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ver3-python-results
          path: ver3/results/ci-85-devices.json
          if-no-files-found: warn

  python-security:
    name: Dependency and Python security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ver3/requirements.txt
      - name: Install audit tools
        run: python -m pip install pip-audit bandit ruff
      - name: Reject unused Python code
        run: ruff check ver3 --select F
      - name: Audit dependencies
        working-directory: ver3
        run: python -m pip_audit -r requirements.txt
      - name: Reject high-severity Bandit findings
        run: >-
          bandit -r ver3
          -x ver3/.venv
          --severity-level high

  android:
    name: Android unit / lint / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test, lint, and build
        working-directory: SensorDataApp-v3
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ver3-android-reports
          path: |
            SensorDataApp-v3/app/build/reports/
            SensorDataApp-v3/app/build/test-results/
          if-no-files-found: warn
